## portal 端口使用 9401-9500
server:
  port: 9401
  shutdown: graceful
  max-http-request-header-size: 32KB

spring:
  application:
    name: chatcut-app-portal
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Nacos 配置中心：共享配置 + 本服务配置，缺失不阻断启动
  config:
    import:
      - optional:nacos:chatcut-common-${spring.profiles.active}.yaml
      - optional:nacos:chatcut-app-portal-${spring.profiles.active}.yaml
  cloud:
    nacos:
      # 地址 / 命名空间 / 分组都由 profile 推导，环境清单见文件末尾 nacos.* 段
      discovery:
        server-addr: ${nacos.server-addr}
        namespace: ${nacos.namespace}
        group: ${nacos.group}
        username: ${nacos.username}
        password: ${nacos.password}
      config:
        server-addr: ${nacos.server-addr}
        namespace: ${nacos.namespace}
        group: ${nacos.group}
        file-extension: yaml
        # Nacos 3.x 默认开启鉴权，不带账号密码会 403 / gRPC 连接被拒
        username: ${nacos.username}
        password: ${nacos.password}

# ---------- 业务开关 ----------
chatcut:
  cors:
    # 官网域名与后台域名可能不同源，按环境在 Nacos 里收敛
    allowed-origins: ${CORS_ORIGINS:*}
  # 注意：本服务不依赖 common-security-web 的会话体系，chatcut.security.type=none
  # （在 Nacos 私有配置里设置）完全免登录；公开读取 + 访客留资/反馈写入，无其他写接口。
  # Redis 仅用于访客接口限流（@RateLimiter/Redisson），连接配置继承 Nacos chatcut-common-local.yaml。

nacos:
  group: DEFAULT_GROUP
  username: ${NACOS_USERNAME:nacos}
  password: ${NACOS_PASSWORD:nacos@@1125}
  server-addr: ${nacos.endpoints.${spring.profiles.active}}
  namespace: ${nacos.namespaces.${spring.profiles.active}}
  endpoints:
    dev: http://47.116.16.246:8848
    test: 127.0.0.1:8848
    prod: nacos.chatcut.internal:8848
  namespaces:
    dev: 65cdf6e6-b3e6-4b85-a074-1775eb55b732
    # 建好 dev / prod 命名空间后把真实 ID 替换进来
    test: 431f3f5a-6814-4885-9c71-e5849c0d1e87
    prod: 00000000-0000-0000-0000-000000000000

