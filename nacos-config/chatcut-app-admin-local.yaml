# ============================================================
# Nacos 配置
#   namespace : chatcut-local（填命名空间的 ID，不是名字）
#   group     : DEFAULT_GROUP
#   dataId    : chatcut-app-admin-local.yaml
#   format    : YAML
#
# admin 的私有中间件配置：数据源 + MQ（admin 允许发/收消息）。
# admin 独立库 chatcut_admin，与 app-api 的 chatcut 分开，便于以后拆库。
# ============================================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:10.0.43.167}:${MYSQL_PORT:3306}/${MYSQL_DB:chatcut_admin}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 注意：这里必须与 Nacos 中的实际值保持一致。曾出现过源文件写 root、Nacos 里是 chatcut_user，
    # 用源文件覆盖发布后账号被改回 root 导致连接失败。local 环境没有 secret 需求，直接写实值。
    username: chatcut_user
    password: chatcut2026test
    hikari:
      pool-name: chatcut-admin-pool
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1200000
      # 保活：每 30s 发一次心跳，避免远程/办公网的空闲连接被 NAT 回收后串到下一次请求上。
      keepalive-time: 30000
      # 首次取连接失败时不 fail-fast：池不会因启动瞬间的网络闪断直接抛异常，网络恢复后自动建立。
      # 不加这行时，日志会出现 HikariPool.checkFailFast -> CommunicationsException / No route to host。
      initialization-fail-timeout: -1

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
  producer:
    group: chatcut-app-admin-producer
    send-message-timeout: 3000

# ---------- 业务开关 ----------
chatcut:
  mq:
    # MQ 总开关。false 时整块 RocketMQ 自动装配被排除：
    # 不创建 producer / RocketMQTemplate、不注册 @RocketMQMessageListener、不连 NameServer；
    # 依赖 MessagePublisher 的代码会在启动时直接失败（fail-fast，不静默丢消息）。
    # 代码缺省为 true，只有显式 false 才关。
    # 本地没起 RocketMQ → false；测试/生产必须 true。
    enabled: false
