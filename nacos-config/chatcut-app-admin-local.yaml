# ============================================================
# Nacos 配置
#   namespace : chatcut-local（namespace ID）
#   group     : DEFAULT_GROUP
#   dataId    : chatcut-app-admin-local.yaml
#   format    : YAML
#
# Admin 使用新库 chatcut_admin_ruoyi。旧 chatcut_admin（自建 RBAC）保留，不迁移、不覆盖。
# MySQL 公共连接参数来自 chatcut-common-local.yaml。
# ============================================================

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          type: ${spring.datasource.type}
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${datasource.host}:3306/chatcut_admin_ruoyi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
          username: ${spring.datasource.username}
          password: ${spring.datasource.password}
      hikari:
        max-pool-size: 8
        min-idle: 2
        connection-timeout: 3000
        validation-timeout: 3000
        idle-timeout: 600000
        max-lifetime: 1200000
        keepalive-time: 30000
  messages:
    basename: i18n/messages
  threads:
    virtual:
      enabled: false
  task:
    execution:
      thread-name-prefix: async-
      mode: force

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
  producer:
    group: chatcut-app-admin-producer
    send-message-timeout: 3000

chatcut:
  mq:
    enabled: false
  cors:
    allowed-origins:
      - "*"
  security:
    type: ruoyi
    # Preserve the existing admin Nacos internal signing secret in each environment.
    internal-secret: ${INTERNAL_SECRET:}

captcha:
  enable: false
  type: math
  numberLength: 1
  charLength: 4
user:
  initPassword: admin123
  password:
    maxRetryCount: 5
    lockTime: 10

tenant:
  enable: false

mybatis-plus:
  enableLogicDelete: true
  mapperPackage: com.chatcut.admin.**.repository.mapper
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  typeAliasesPackage: com.chatcut.admin.**.repository.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    jdbc-type-for-null: 'null'
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

security:
  excludes:
    - /*.html
    - /**/*.html
    - /**/*.css
    - /**/*.js
    - /favicon.ico
    - /error
    - /*/api-docs
    - /*/api-docs/**
    - /warm-flow-ui/config

logging:
  config: classpath:logback-plus.xml
  level:
    com.chatcut: info
    org.springframework: warn
    org.mybatis.spring.mapper: error
    org.apache.fury: warn

springdoc:
  api-docs:
    enabled: true
  info:
    title: 'ChatCut 管理后台接口'
    description: 'ChatCut 运营管理与审计接口'
    version: '1.0.0'
  group-configs:
    - group: ChatCut Admin
      packages-to-scan: com.chatcut.admin

api-decrypt:
  enabled: false
xss:
  enabled: true
  excludeUrls:
    - /system/notice
lock4j:
  acquire-timeout: 3000
  expire: 30000

# RuoYi login controller publishes a welcome event through SSE after login.
sse:
  enabled: true
  path: /resource/sse
websocket:
  enabled: false
  path: /resource/websocket
  allowedOrigins: '*'
