# ============================================================
# Nacos 配置
#   namespace : chatcut-local（填命名空间的 ID，不是名字）
#   group     : DEFAULT_GROUP
#   dataId    : chatcut-common-local.yaml
#   format    : YAML
#
# 三个服务（gateway / app-api / app-admin）共用，放跨服务共享的配置。
# 里面的 ${ENV:default} 占位符在服务启动时仍会从机器环境变量取值——没设就用 default。
# 优先级：远程配置 > 本地 jar 配置，本文件中的 key 会覆盖服务 application.yml 的同名 key。
# ============================================================

# 注意：跨 dataId 的 ${...} 占位符引用不解析（实测，Spring Cloud Alibaba config-data），
# 但属性级合并生效：所有服务统一走 dynamic-datasource，账号类默认值集中在
# spring.datasource.dynamic.datasource.master.*，各服务 dataId 只写自己的 url 和连接池。
# ${MYSQL_*:默认值} 是环境变量占位符（始终可见），换环境优先用部署环境变量覆盖。

spring:
  datasource:
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          username: ${MYSQL_USER:root}
          password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      # 网关的 sa-token 会话与业务服务必须指向同一个 Redis 实例、同一个 database，
      # 否则网关校验不到业务服务写入的登录态。
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # redis-test 容器启动命令已带 --requirepass，此处直接写死，无需环境变量
      password: cc-dev-123
      database: 0
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2s
  lifecycle:
    timeout-per-shutdown-phase: 30s

# ---------- MyBatis-Plus ----------
# gateway 不接 DB，此段对它无意义但无害。
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------- Sa-Token ----------
# 会话存储：Redis，采用与 RuoYi Plus 相同的 Sa-Token DAO 序列化，多节点共享、重启不掉线；
# 由 ChatCut 网关与若依 admin 共用兼容 DAO，禁止退化成内存实现。
# 注意：chatcut.security.type 在服务私有配置里，不在公共段。
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  # Replace this placeholder with the same random key used by gateway and admin in this environment.
  jwt-secret-key: ${RUOYI_JWT_SECRET:CHANGE_ME_TO_A_RANDOM_SECRET_IN_NACOS}
  is-read-header: true
  is-read-cookie: false
  # 允许多端同时在线（多节点部署下不做单端互踢）
  is-concurrent: true
  # 不共用 token：每次登录签发新 token，便于按端退出
  is-share: false
  token-style: uuid
  is-log: false

# ---------- 监控 ----------
# 三个服务共有的基础端点；gateway 端点只有网关有，放在 chatcut-gateway-{profile}.yaml 里单独加。
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ---------- 日志 ----------
# 文件名按 spring.application.name 参数化，一份配置三个服务共用。
logging:
  level:
    root: INFO
    com.chatcut: INFO
  pattern:
    # console 只作用于控制台，file 才作用于日志文件——两者都要显式配，否则文件用 Boot 默认 pattern，丢失 traceId。
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  # 落盘：排查问题直接 grep traceId，不依赖 IDEA 控制台（文件与控制台内容一致）。
  file:
    name: ${user.home}/logs/chatcut/${spring.application.name}.log
  logback:
    rollingpolicy:
      file-name-pattern: "${user.home}/logs/chatcut/${spring.application.name}.%d{yyyy-MM-dd}.%i.log.gz"
      max-file-size: 50MB
      max-history: 14
      total-size-cap: 1GB

# ---------- 出入参日志切面 ----------
# controller 层自动切入（com.chatcut..controller..*），service 层用 @LogInvocation 手动标记。
# 敏感字段（黑名单，小写比较）输出 "***"；不截断；慢接口（超过阈值）打 WARN+SLOW。
# 注意：改这里的黑名单后需要重启服务（未开配置刷新）。gateway 是 WebFlux，不加载该切面，此段对它无意义但无害。
chatcut:
  log:
    invocation:
      enabled: true
      slow-threshold-ms: 1000
      sensitive-fields: [password, oldpassword, newpassword, confirmpassword, token, authorization, secret, smscode, idcard, phone, mobile]
      exclude-paths: [/actuator/**, /v3/api-docs/**, /doc.html, /swagger-ui/**, /swagger-ui.html, /webjars/**, /favicon.ico, /internal/**, /error]
