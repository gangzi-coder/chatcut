server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: chatcut-app-admin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    import:
      - optional:nacos:chatcut-common-${spring.profiles.active}.yaml
      - optional:nacos:chatcut-app-admin-${spring.profiles.active}.yaml
  cloud:
    nacos:
      # 地址 / 命名空间 / 分组都由 profile 推导，环境清单见文件末尾 nacos.* 段
      discovery:
        server-addr: ${nacos.server-addr}
        namespace: ${nacos.namespace}
        group: ${nacos.group}
        username: ${nacos.username}
        password: ${nacos.password}
      config:
        server-addr: ${nacos.server-addr}
        namespace: ${nacos.namespace}
        group: ${nacos.group}
        file-extension: yaml
        # Nacos 3.x 默认开启鉴权，不带账号密码会 403 / gRPC 连接被拒
        username: ${nacos.username}
        password: ${nacos.password}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------- Sa-Token ----------
# 会话存储：Redis（SaTokenDaoRedisJackson），多节点共享、重启不掉线；
# 由 common-security-core 的 SaTokenStorageConfig 显式注册进 SaManager，禁止退化成内存实现。
# Redis 连接放 Nacos 的 chatcut-common-{profile}.yaml，三个服务必须同一实例同一 database。
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-read-header: true
  is-read-cookie: false
  # 允许多端同时在线（多节点部署下不做单端互踢）
  is-concurrent: true
  # 不共用 token：每次登录签发新 token，便于按端退出
  is-share: false
  token-style: uuid
  is-log: false

# ---------- 监控 ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ---------- 日志 ----------
logging:
  level:
    root: INFO
    com.chatcut: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  # 落盘：排查问题直接 grep traceId，不依赖 IDEA 控制台（文件与控制台内容一致）。
  file:
    name: ${user.home}/logs/chatcut/chatcut-admin.log
  logback:
    rollingpolicy:
      file-name-pattern: "${user.home}/logs/chatcut/chatcut-admin.%d{yyyy-MM-dd}.%i.log.gz"
      max-file-size: 50MB
      max-history: 14
      total-size-cap: 1GB

nacos:
  group: DEFAULT_GROUP
  username: ${NACOS_USERNAME:nacos}
  password: ${NACOS_PASSWORD:nacos}
  server-addr: ${nacos.endpoints.${spring.profiles.active}}
  namespace: ${nacos.namespaces.${spring.profiles.active}}
  endpoints:
    local: 127.0.0.1:8848
    dev: nacos-dev.chatcut.internal:8848
    prod: nacos.chatcut.internal:8848
  namespaces:
    local: 1898c274-9625-4117-ba85-e3757117deeb
    # 建好 dev / prod 命名空间后把真实 ID 替换进来
    dev: 00000000-0000-0000-0000-000000000000
    prod: 00000000-0000-0000-0000-000000000000
